services:
  - type: web
    name: auctionx-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        value: https://your-frontend-on-vercel.vercel.app
      - key: CRON_SECRET
        sync: false
    # FastAPI apps need to be run from the backend directory if imports are relative to it
    # But since imports are `app.*`, we run from the backend root.
    rootDirectory: backend
